[project]
name = "ghosttrace-backend"
version = "0.1.0"
description = "GhostTrace API: explainable incident reconstruction from application events."
readme = "../README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "python-multipart==0.0.32",
  "httpx2==2.13.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S", "B"]
"scripts/**" = ["S"]
"app/simulation/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "app/tests/"]
